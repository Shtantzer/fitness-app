<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<section class="py-20">

  <div class="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-12">

    <div>

      <h1 class="text-5xl font-bold mb-6">
        Contact Me
      </h1>

      <p class="text-gray-600 text-lg mb-8">
        Have questions? Let's talk about your fitness goals.
      </p>

      <div class="space-y-4 text-gray-700">
        <p>📧 support@fitrevolution.com</p>
        <p>📞 +1 800 FIT REV</p>
        <p>🕒 Monday – Friday, 9am – 6pm</p>
      </div>

    </div>

    <div class="bg-white p-8 rounded-2xl shadow">

      <form class="space-y-6">

        <div>
          <label class="block mb-2 font-semibold">
            Name
          </label>

          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-3"
          >
        </div>

        <div>
          <label class="block mb-2 font-semibold">
            Email
          </label>

          <input
            type="email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3"
          >
        </div>

        <div>
          <label class="block mb-2 font-semibold">
            Message
          </label>

          <textarea
            rows="5"
            class="w-full border border-gray-300 rounded-lg px-4 py-3"
          ></textarea>
        </div>

        <button
          class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-semibold"
        >
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>

</body>
</html>
